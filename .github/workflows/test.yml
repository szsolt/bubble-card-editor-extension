name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - name: Verify dist is built from current src
        run: |
          npm run build
          if ! git diff --quiet -- dist/bubble-card-editor.js; then
            echo "::error::dist/bubble-card-editor.js is stale — run 'npm run build' and commit it"
            git --no-pager diff -- dist/bubble-card-editor.js
            exit 1
          fi
